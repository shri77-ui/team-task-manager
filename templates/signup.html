{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo mb-1">TaskFlow</div>
      <p class="text-muted mb-0" style="font-size:.875rem">Create your account</p>
    </div>

    <form method="POST" action="{{ url_for('signup') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.875rem">Username</label>
        <input type="text" name="username" class="form-control form-control-lg"
               placeholder="johndoe" required autofocus />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.875rem">Email address</label>
        <input type="email" name="email" class="form-control form-control-lg"
               placeholder="you@company.com" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.875rem">Password</label>
        <input type="password" name="password" class="form-control form-control-lg"
               placeholder="At least 6 characters" required minlength="6" />
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold" style="font-size:.875rem">Role</label>
        <select name="role" class="form-select form-select-lg">
          <option value="member">Member</option>
          <option value="admin">Admin</option>
        </select>
        <div class="form-text">Admins can create and manage all tasks.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
        <i class="bi bi-person-plus me-2"></i>Create Account
      </button>
    </form>

    <p class="text-center text-muted mb-0" style="font-size:.875rem">
      Already have an account?
      <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
