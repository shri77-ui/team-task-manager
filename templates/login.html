{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo mb-1">TaskFlow</div>
      <p class="text-muted mb-0" style="font-size:.875rem">Sign in to your workspace</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.875rem">Email address</label>
        <input type="email" name="email" class="form-control form-control-lg"
               placeholder="you@company.com" required autofocus />
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold" style="font-size:.875rem">Password</label>
        <input type="password" name="password" class="form-control form-control-lg"
               placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <p class="text-center text-muted mb-0" style="font-size:.875rem">
      Don't have an account?
      <a href="{{ url_for('signup') }}" class="text-primary fw-semibold text-decoration-none">Create one</a>
    </p>

    <hr class="my-4">
    <div class="p-3 rounded-3" style="background:#f8fafc;border:1px solid #e2e8f0">
      <p class="mb-1 fw-semibold" style="font-size:.8rem;color:#475569">
        <i class="bi bi-info-circle me-1"></i>Demo credentials
      </p>
      <p class="mb-0" style="font-size:.8rem;color:#64748b">
        Email: <code>admin@taskmanager.com</code><br>
        Password: <code>admin123</code>
      </p>
    </div>
  </div>
</div>
{% endblock %}
