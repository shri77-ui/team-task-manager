{% extends "base.html" %}
{% block title %}Create Task{% endblock %}
{% block page_title %}Create Task{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-7">
    <div class="mb-4">
      <h2 class="mb-1 fw-bold" style="font-family:'Instrument Serif',serif;font-size:1.5rem">New Task</h2>
      <p class="text-muted mb-0" style="font-size:.875rem">Fill in the details below to create a task.</p>
    </div>

    <div class="card">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('create_task') }}">

          <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:.875rem">
              Task Title <span class="text-danger">*</span>
            </label>
            <input type="text" name="title" class="form-control"
                   placeholder="e.g. Design landing page mockup" required autofocus />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:.875rem">Description</label>
            <textarea name="description" class="form-control" rows="4"
                      placeholder="Add more context, acceptance criteria, links…"></textarea>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold" style="font-size:.875rem">Priority</label>
              <select name="priority" class="form-select">
                <option value="low">🟢 Low</option>
                <option value="medium" selected>🟡 Medium</option>
                <option value="high">🔴 High</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold" style="font-size:.875rem">Due Date</label>
              <input type="date" name="due_date" class="form-control" />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold" style="font-size:.875rem">Assign To</label>
            <select name="assigned_to" class="form-select">
              <option value="">— Unassigned —</option>
              {% for member in members %}
              <option value="{{ member.id }}">
                {{ member.username }} ({{ member.role | capitalize }})
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-plus-circle me-1"></i>Create Task
            </button>
            <a href="{{ url_for('tasks') }}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
